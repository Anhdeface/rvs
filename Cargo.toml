[package]
name = "rvs"
version = "0.4.0"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
zip = { version = "0.6", default-features = false, features = ["deflate"] }
asc-axml = "0.2.0"
quick-xml = "0.37.5"
dex = "0.5.0"
goblin = "0.10.7"
apk-info = { version = "1.1.1", default-features = false }

[dev-dependencies]
tempfile = "3.10"
assert_cmd = "2.0"
predicates = "3.1"
